name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Versioned files are declared in release-please-config.json, so the
          # plugin.json version Claude Code reads moves with every release.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Note: this plugin ships as a Claude Code plugin (directory), not as
  # a pip-installable wheel. Users install it via the marketplace, not
  # via `pip install musubi-claude`. The release-please PR bumps
  # pyproject.toml and .claude-plugin/plugin.json (release-please-config.json
  # extra-files); merging it cuts a GitHub Release for the new plugin version.
