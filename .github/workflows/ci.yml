name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install plugin + dev tooling
        run: |
          python -m pip install --upgrade pip
          # Pin the harness the plugin was developed against; bump in lock-step
          # with pyproject.toml. The harness version controls the contract the
          # adapter depends on.
          pip install "musubi-harness>=1.1.0,<2.0.0"
          pip install -e .
          pip install ruff mypy pytest pytest-cov

      - name: ruff (lint)
        run: ruff check scripts tests

      - name: ruff (format check)
        run: ruff format --check scripts tests

      - name: mypy --strict
        run: mypy scripts

      - name: pytest
        run: pytest --cov=scripts --cov-report=term-missing

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Claude Code
        run: |
          # install.sh is a bash script (#!/bin/bash) and installs to ~/.local/bin.
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate plugin + marketplace manifests
        run: claude plugin validate --strict .
